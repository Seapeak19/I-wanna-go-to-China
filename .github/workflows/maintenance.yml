name: Refresh reference rates and source availability
on:
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: reference-maintenance
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-rates.mjs
      - run: node scripts/source-health.mjs --limit=40
      - name: Commit reference snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add currency-core.js research/rate-maintenance.json research/source-health.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dated reference rates and source availability"
            git push origin HEAD:main
          fi
  deploy:
    needs: refresh
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
